# PPO on the CPU build of PyTorch. MuJoCo itself is also CPU-side.
# 10_000_000 steps is the full run. Eight subprocesses use the CPU cores.
# models/walk_baseline is the --no-dr run. models/walk_dr is this config with DR on.

algo: PPO
device: cpu
total_timesteps: 10000000
n_envs: 8

policy:
  type: MlpPolicy
  net_arch:
    pi: [256, 256, 128]
    vf: [256, 256, 128]
  activation_fn: ReLU
  # std starts near 0.37 so the first actions stay close to the standing pose.
  log_std_init: -1.0

learning_rate: 3.0e-4
n_steps: 512
batch_size: 128
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.002
vf_coef: 0.5
max_grad_norm: 0.5
normalize_advantage: true
